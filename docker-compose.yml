# 本機開發用：PostgreSQL + Redis
# 正式環境資料庫改用 Supabase，Redis 可用 Upstash。
services:
  postgres:
    image: postgres:16-alpine
    container_name: photoflow-postgres
    environment:
      POSTGRES_USER: photoflow
      POSTGRES_PASSWORD: photoflow
      POSTGRES_DB: photoflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: photoflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
